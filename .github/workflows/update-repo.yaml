name: Update APT Metadata
on:
  push:
    paths:
      - 'incoming/**'

jobs:
  rebuild-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup GPG
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d > private.key
          gpg --import private.key
          rm private.key

      - name: Rebuild APT Structure
        run: |
          # Define architectures you support
          ARCHS=("amd64" "armhf" "arm64" "riscv64")
          
          mkdir -p docs/pool/main
          mv incoming/*.deb docs/pool/main/ || true

          for ARCH in "${ARCHS[@]}"; do
            mkdir -p docs/dists/stable/main/binary-$ARCH
            # Scan only for the specific architecture
            apt-ftparchive --arch $ARCH packages docs/pool/main > docs/dists/stable/main/binary-$ARCH/Packages
            gzip -9fk docs/dists/stable/main/binary-$ARCH/Packages
          done

          # Generate Release metadata
          apt-ftparchive release docs/dists/stable > docs/dists/stable/Release
          
          # Sign the repo
          gpg --yes --clearsign -o docs/dists/stable/InRelease docs/dists/stable/Release
          gpg --yes -abs -o docs/dists/stable/Release.gpg docs/dists/stable/Release

      - name: Commit and Push
        run: |
          git config user.name "Atsign Robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.
          git commit -m "Update repository metadata - gha${{github.run_number}}"
          git push origin trunk